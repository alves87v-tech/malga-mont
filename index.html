<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Malga Mont - Sito in preparazione</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #f4f2eb;
      color: #143826;
      font-family: Arial, Helvetica, sans-serif;
    }

    .preview-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      text-align: center;
      background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)),
        url("Asset/Header/hero-section/img/wide/img_1.jpg") center / cover no-repeat;
    }

    .preview-box {
      width: min(100%, 760px);
    }

    .preview-logo {
      display: block;
      width: min(280px, 72vw);
      margin: 0 auto 34px;
    }

    .preview-eyebrow {
      margin: 0 0 16px;
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #d9c08b;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(2.5rem, 10vw, 5.8rem);
      line-height: .95;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #fff;
    }

    .preview-text {
      max-width: 620px;
      margin: 0 auto;
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      line-height: 1.65;
      color: rgba(255,255,255,.92);
    }

    .preview-small {
      max-width: 560px;
      margin: 26px auto 0;
      font-size: .92rem;
      line-height: 1.5;
      color: rgba(255,255,255,.76);
    }
  </style>
</head>

<body>
  <main class="preview-page">
    <section class="preview-box" aria-label="Sito in preparazione">
      <img
        class="preview-logo"
        src="Asset/Header/hero-section/logo/logo_6.svg"
        alt="Malga Mont Agriturismo">

      <p class="preview-eyebrow">Sito ufficiale in preparazione</p>

      <h1>Malga Mont</h1>

      <p class="preview-text">
        Stiamo preparando il nuovo sito per raccontare la malga,
        i sapori della casa, i pascoli e i percorsi per raggiungerci.
      </p>

      <p class="preview-small">
        Per informazioni e prenotazioni vi consigliamo di contattarci telefonicamente
        o tramite WhatsApp.
      </p>
    </section>
  </main>
</body>
</html>
